services:
  redis:
    image: redis:7-alpine
    restart: always
    ports: [ "6379:6379" ]
    volumes:
      - redis_data:/data
    networks: [ crm-network ]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks: [ crm-network ]

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: companycrm-backend:latest
    working_dir: /app/apps/gateway
    command: npm start
    ports: [ "5000:5000" ]
    environment:
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://auth-service:5001
      - CONTACT_SERVICE_URL=http://contact-service:5002
      - OPPORTUNITY_SERVICE_URL=http://opportunity-service:5003
      - TASK_SERVICE_URL=http://task-service:5004
      - NOTIFICATION_SERVICE_URL=http://notification-service:5005
      - ANALYTICS_SERVICE_URL=http://analytics-service:5006
      - DOCUMENT_SERVICE_URL=http://document-service:5007
      - PRODUCT_SERVICE_URL=http://product-service:5008
      - INVOICE_SERVICE_URL=http://invoice-service:5009
      - TICKET_SERVICE_URL=http://ticket-service:5010
      - SEARCH_SERVICE_URL=http://search-service:5011
      - HR_SERVICE_URL=http://hr-service:5012
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on:
      - redis
    networks: [ crm-network ]
    restart: always

  auth-service:
    image: companycrm-backend:latest
    working_dir: /app/apps/auth-service
    command: npm start
    environment:
      - PORT=5001
      - MONGO_URI=${AUTH_MONGO_URI:-${MONGO_URI}}
      - AUTH_MONGO_URI=${AUTH_MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - SENDER_EMAIL=${SENDER_EMAIL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://rabbitmq:5672}
    depends_on:
      - gateway
      - redis
      - rabbitmq
    networks: [ crm-network ]
    restart: always

  contact-service:
    image: companycrm-backend:latest
    working_dir: /app/apps/contact-service
    command: npm start
    environment:
      - PORT=5002
      - MONGO_URI=${CONTACT_MONGO_URI:-${MONGO_URI}}
      - CONTACT_MONGO_URI=${CONTACT_MONGO_URI}
      - AUTH_SERVICE_URL=http://auth-service:5001
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://rabbitmq:5672}
    depends_on:
      - gateway
      - rabbitmq
    networks: [ crm-network ]
    restart: always

  opportunity-service:
    image: companycrm-backend:latest
    working_dir: /app/apps/opportunity-service
    command: npm start
    environment:
      - PORT=5003
      - MONGO_URI=${OPPORTUNITY_MONGO_URI:-${MONGO_URI}}
      - OPPORTUNITY_MONGO_URI=${OPPORTUNITY_MONGO_URI}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://rabbitmq:5672}
    depends_on:
      - gateway
    networks: [ crm-network ]
    restart: always

  task-service:
    image: companycrm-backend:latest
    working_dir: /app/apps/task-service
    command: npm start
    environment:
      - PORT=5004
      - MONGO_URI=${TASK_MONGO_URI:-${MONGO_URI}}
      - TASK_MONGO_URI=${TASK_MONGO_URI}
      - AUTH_SERVICE_URL=http://auth-service:5001
      - NOTIFICATION_SERVICE_URL=http://notification-service:5005
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://rabbitmq:5672}
    depends_on:
      - gateway
    networks: [ crm-network ]
    restart: always

  notification-service:
    image: companycrm-backend:latest
    working_dir: /app/apps/notification-service
    command: npm start
    environment:
      - PORT=5005
      - MONGO_URI=${NOTIFICATION_MONGO_URI:-${MONGO_URI}}
      - NOTIFICATION_MONGO_URI=${NOTIFICATION_MONGO_URI}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - SENDER_EMAIL=${SENDER_EMAIL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://rabbitmq:5672}
      - TASK_SERVICE_URL=http://task-service:5004
    depends_on:
      - gateway
      - rabbitmq
    networks: [ crm-network ]
    restart: always

  analytics-service:
    image: companycrm-backend:latest
    working_dir: /app/apps/analytics-service
    command: npm start
    environment:
      - PORT=5006
      - MONGO_URI=${ANALYTICS_MONGO_URI:-${MONGO_URI}}
      - ANALYTICS_MONGO_URI=${ANALYTICS_MONGO_URI}
      - CONTACT_SERVICE_URL=http://contact-service:5002
      - OPPORTUNITY_SERVICE_URL=http://opportunity-service:5003
      - TASK_SERVICE_URL=http://task-service:5004
      - INVOICE_SERVICE_URL=http://invoice-service:5009
      - TICKET_SERVICE_URL=http://ticket-service:5010
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://rabbitmq:5672}
    depends_on:
      - gateway
    networks: [ crm-network ]
    restart: always

  document-service:
    image: companycrm-backend:latest
    working_dir: /app/apps/document-service
    command: npm start
    environment:
      - PORT=5007
      - MONGO_URI=${DOCUMENT_MONGO_URI:-${MONGO_URI}}
      - DOCUMENT_MONGO_URI=${DOCUMENT_MONGO_URI}
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://rabbitmq:5672}
    volumes:
      - document_uploads:/app/apps/document-service/uploads
    depends_on:
      - gateway
    networks: [ crm-network ]
    restart: always

  product-service:
    image: companycrm-backend:latest
    working_dir: /app/apps/product-service
    command: npm start
    environment:
      - PORT=5008
      - MONGO_URI=${PRODUCT_MONGO_URI:-${MONGO_URI}}
      - PRODUCT_MONGO_URI=${PRODUCT_MONGO_URI}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://rabbitmq:5672}
    depends_on:
      - gateway
    networks: [ crm-network ]
    restart: always

  invoice-service:
    image: companycrm-backend:latest
    working_dir: /app/apps/invoice-service
    command: npm start
    environment:
      - PORT=5009
      - MONGO_URI=${INVOICE_MONGO_URI:-${MONGO_URI}}
      - INVOICE_MONGO_URI=${INVOICE_MONGO_URI}
      - NOTIFICATION_SERVICE_URL=http://notification-service:5005/api/notifications/email
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://rabbitmq:5672}
    depends_on:
      - gateway
    networks: [ crm-network ]
    restart: always

  ticket-service:
    image: companycrm-backend:latest
    working_dir: /app/apps/ticket-service
    command: npm start
    environment:
      - PORT=5010
      - MONGO_URI=${TICKET_MONGO_URI:-${MONGO_URI}}
      - TICKET_MONGO_URI=${TICKET_MONGO_URI}
      - CONTACT_SERVICE_URL=http://contact-service:5002
      - NOTIFICATION_SERVICE_URL=http://notification-service:5005
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://rabbitmq:5672}
    depends_on:
      - gateway
    networks: [ crm-network ]
    restart: always

  search-service:
    image: companycrm-backend:latest
    working_dir: /app/apps/search-service
    command: npm start
    environment:
      - PORT=5011
      - MONGO_URI=${SEARCH_MONGO_URI:-${MONGO_URI}}
      - SEARCH_MONGO_URI=${SEARCH_MONGO_URI}
      - CONTACT_SERVICE_URL=http://contact-service:5002
      - OPPORTUNITY_SERVICE_URL=http://opportunity-service:5003
      - TICKET_SERVICE_URL=http://ticket-service:5010
      - PRODUCT_SERVICE_URL=http://product-service:5008
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://rabbitmq:5672}
    depends_on:
      - gateway
    networks: [ crm-network ]
    restart: always

  hr-service:
    image: companycrm-backend:latest
    working_dir: /app/apps/hr-service
    command: npm start
    environment:
      - PORT=5012
      - MONGO_URI=${HR_MONGO_URI:-${MONGO_URI}}
      - HR_MONGO_URI=${HR_MONGO_URI}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - SENDER_EMAIL=${SENDER_EMAIL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://rabbitmq:5672}
    depends_on:
      - gateway
    networks: [ crm-network ]
    restart: always

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    ports: [ "3000:80" ]
    depends_on: [ gateway ]
    networks: [ crm-network ]
    restart: always

volumes:
  document_uploads:
  redis_data:
  rabbitmq_data:

networks:
  crm-network:
    driver: bridge
